name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); if(!m.chrome_url_overrides?.newtab) process.exit(1)"
      - name: Check JavaScript syntax
        run: |
          node --check newtab.js
          node --check options.js
      - name: Check required files
        run: |
          test -s newtab.html
          test -s styles.css
          test -s README.md
